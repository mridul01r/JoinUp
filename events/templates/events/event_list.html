<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Events</title>
</head>
<body>
    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

     <h1>Available Events</h1>

    {% for event in events %}
        <h2>{{ event.title }}</h2>
        <p>Event ID: {{ event.pk }}</p>

        {% if request.user != event.created_by %}
            <form method="POST" action="{% url 'request_to_join' event.pk %}">
                {% csrf_token %}
                <button type="submit">Request to Join</button>
            </form>
        {% endif %}
    {% empty %}
        <p>No events available.</p>
    {% endfor %}

</body>
</html>
